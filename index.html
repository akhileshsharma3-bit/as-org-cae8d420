ng & Service Engineering,Dada Hayat,Sub-team: Warranty\nRanjit Appaso Jagatap,Warranty claims - HV Parts,Product Monitoring & Service Engineering,Dada Hayat,Sub-team: Warranty\nHimanshu Jadaun,Warranty claims - HV Parts,Product Monitoring & Service Engineering,Dada Hayat,Sub-team: Warranty\nNagaraj Tammidi,Technical support & Product Monitoring,Product Monitoring & Service Engineering,Senthil Kumar S,Sub-team: Technical Support\nThugutla Narahari,\"Diagnostic Support - GJ, UP & North\",Product Monitoring & Service Engineering,Nagaraj Tammidi,Sub-team: Technical Support\nJai Prakash,\"Diagnostic Support - TN, KA & WBNE\",Product Monitoring & Service Engineering,Nagaraj Tammidi,Sub-team: Technical Support\nSrinivasan Pragasam,\"Diagnostic Support - APTG, KL & BJHO\",Product Monitoring & Service Engineering,Nagaraj Tammidi,Sub-team: Technical Support\nMubarak Kondakamala Basha,\"Diagnostic Support - MH, MPCG & RJ\",Product Monitoring & Service Engineering,Nagaraj Tammidi,Sub-team: Technical Support\nArunagirinathan S,Product Monitoring,Product Monitoring & Service Engineering,Nagaraj Tammidi,Sub-team: Technical Support\nRamesh PN,Business Planner,Direct reports,Punnaivanam S,\nRudraksh Tiwari,Intern,Direct reports,Punnaivanam S,\nAnkita Singh,Intern,Direct reports,Punnaivanam S,\n17 RSLs,,Direct reports,Punnaivanam S,Group card (count only)\nSatish,(no title shown),Direct reports,Ramesh PN,Title not provided\nAndrew,(no title shown),Direct reports,Satish,Title not provided\n";

function parseCsv(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f="";rows.push(r);r=[]}else f+=c}if(f!==""||r.length){r.push(f);rows.push(r)}
 const h=rows.shift().map(s=>s.trim().toLowerCase());return rows.filter(x=>x.length>1||x[0]).map(x=>{const o={};["name","title","team","manager","notes"].forEach(k=>{const i=h.indexOf(k);o[k]=i>=0?(x[i]||""):""});return o}).filter(o=>o.name)}
const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
function toCsv(){return "name,title,team,manager,notes\n"+P.map(p=>[p.name,p.title,p.team,p.manager,p.notes].map(esc).join(",")).join("\n")+"\n"}

(function(){try{if(!localStorage.getItem(KEY+".fix2")){const M={"Swapnil Anant Talge":"Gouse Peera","Raju Karimilla":"Gouse Peera","Galande Sujit Tatyasaheb":"Dada Hayat"};P.forEach(p=>{if(M[p.name])p.manager=M[p.name]});localStorage.setItem(KEY,JSON.stringify(P));localStorage.setItem(KEY+".fix2","1")}}catch(e){}})();

(function(){try{if(!localStorage.getItem(KEY+".fix4")){if(!P.some(p=>p.name==="17 RSLs"))P.push(parseCsv(ORIG_CSV).find(x=>x.name==="17 RSLs"));localStorage.setItem(KEY,JSON.stringify(P));localStorage.setItem(KEY+".fix4","1")}}catch(e){}})();

(function(){const have=new Set(P.map(p=>p.name));let add=false;["Satish","Andrew"].forEach(n=>{if(!have.has(n)){const o=parseCsv(ORIG_CSV).find(x=>x.name===n);if(o){P.push(o);add=true}}});if(add)try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}})();
let collapsed={},sel=null,editing=null,adding=false,scale=1,tx=0,ty=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));stat("Saved ✓ (this browser)")}catch(e){stat("Could not save (storage blocked)")}}

const COLORS=["#1f4e9c","#2a9d8f","#e76f51","#8e5bd6","#c9a227","#d1477a","#4c956c","#5c6b8a","#e07b00"];
function tcolor(t){const ts=[...new Set(P.map(p=>p.team))];return COLORS[ts.indexOf(t)%COLORS.length]}
function kids(n){return P.filter(p=>p.manager===n)}
function roots(){const ns=new Set(P.map(p=>p.name));return P.filter(p=>!p.manager||!ns.has(p.manager))}
function desc(n,seen=new Set()){let c=0;for(const k of kids(n)){if(seen.has(k.name))continue;seen.add(k.name);c+=1+desc(k.name,seen)}return c}
const H=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nodeHtml(p,depth){const k=kids(p.name),cl=!!collapsed[p.name],u=(p.notes||"").startsWith("UNCLEAR")||p.name.startsWith("(Unnamed)");
 let h=`<li class="${k.length?'hasbtn':''}" data-n="${H(p.name)}"><div class="card${u?' u':''}${sel===p.name?' sel':''}" style="--c:${tcolor(p.team)}" data-n="${H(p.name)}" title="${H(p.notes||'')}"><div class="n">${H(p.name)}</div><div class="t">${H(p.title)}</div><span class="tm">${H(p.team)}</span>`;
 if(k.length)h+=`<button class="tg" data-t="${H(p.name)}">${cl?'+ '+desc(p.name):'−'}</button>`;
 h+=`</div>`;if(k.length&&!cl&&depth<50)h+=`<ul>${k.map(c=>nodeHtml(c,depth+1)).join("")}</ul>`;return h+"</li>"}
function render(keep){const st=document.getElementById("stage");st.innerHTML=`<ul>${roots().map(r=>nodeHtml(r,0)).join("")}</ul>`;
 const ts=[...new Set(P.map(p=>p.team))];document.getElementById("legend").innerHTML=ts.map(t=>`<span><i style="background:${tcolor(t)}"></i>${H(t)} (${P.filter(p=>p.team===t).length})</span>`).join("")+`<span><b>${P.length}</b> people</span>`;
 apply();if(!keep)fit()}
function apply(){document.getElementById("stage").style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(){const vp=document.getElementById("vp"),st=document.getElementById("stage");st.style.transform="none";const w=st.offsetWidth,h=st.offsetHeight;scale=Math.min(vp.clientWidth/w,vp.clientHeight/h,1.2);tx=(vp.clientWidth-w*scale)/2;ty=Math.max(0,(vp.clientHeight-h*scale)/2);apply()}
function zoomAt(f,cx,cy){const ns=Math.min(3,Math.max(.08,scale*f));tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;apply()}
function zoomBy(f){const vp=document.getElementById("vp");zoomAt(f,vp.clientWidth/2,vp.clientHeight/2)}
function expandAll(){collapsed={};render()}function collapseAll(){P.forEach(p=>{if(kids(p.name).length)collapsed[p.name]=true});const r=roots();render()}

vp.addEventListener("wheel",e=>{e.preventDefault();const b=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX-b.left,e.clientY-b.top)},{passive:false});

function doFind(v){v=v.trim().toLowerCase();document.querySelectorAll("li.hl").forEach(x=>x.classList.remove("hl"));if(!v)return;
 const hit=P.filter(p=>(p.name+" "+p.title).toLowerCase().includes(v));let changed=false;hit.forEach(h=>{let m=h.manager;const by=Object.fromEntries(P.map(p=>[p.name,p]));while(m&&by[m]){if(collapsed[m]){collapsed[m]=false;changed=true}m=by[m].manager}});
 if(changed)render(true);const names=new Set(hit.map(h=>h.name));document.querySelectorAll("li[data-n]").forEach(li=>{if(names.has(li.dataset.n))li.classList.add("hl")});stat(hit.length+" match(es)")}
function opts(excl){const bad=new Set(excl?[excl]:[]);if(excl){const walk=n=>kids(n).forEach(k=>{if(!bad.has(k.name)){bad.add(k.name);walk(k.name)}});walk(excl)}
 return `<option value="">(none – top level)</option>`+P.filter(p=>!bad.has(p.name)).map(p=>`<option>${H(p.name)}</option>`).join("")}
function form(p,orig){const s=document.getElementById("side");s.className="on";
 s.innerHTML=`<b>${orig?'Edit person':'Add person'}</b><label>Name</label><input id="f_n" value="${H(p.name)}"><label>Title</label><input id="f_t" value="${H(p.title)}"><label>Team</label><input id="f_te" list="tl" value="${H(p.team)}"><datalist id="tl">${[...new Set(P.map(x=>x.team))].map(t=>`<option>${H(t)}</option>`).join("")}</datalist><label>Manager (change to move them with their team)</label><select id="f_m">${opts(orig)}</select><label>Notes</label><input id="f_no" value="${H(p.notes||'')}">
 <div class="row"><button class="p" onclick="saveP(${orig?`'${orig.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}'`:"''"})">Save</button><button onclick="closeSide()">Cancel</button>${orig?`<button onclick="addP(document.getElementById('f_n').defaultValue)">Add report</button><button class="d" onclick="removeP('${orig.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')">Remove</button>`:""}</div>

function openEdit(n){const p=P.find(x=>x.name===n);if(p)form(p,n)}

function saveP(orig){const g=i=>document.getElementById(i).value.trim();const nm=g("f_n");const er=document.getElementById("err");
 if(!nm){er.textContent="Name is required.";return}if(nm!==orig&&P.some(p=>p.name===nm)){er.textContent="That name already exists.";return}

 if(!orig)P.push(o);else{P=P.map(p=>p.name===orig?o:(p.manager===orig?{...p,manager:nm}:p));if(collapsed[orig]){collapsed[nm]=true;delete collapsed[orig]}}

function removeP(n){if(!confirm("Remove "+n+"? Their reports move up one level."))return;const me=P.find(p=>p.name===n);P=P.filter(p=>p.name!==n).map(p=>p.manager===n?{...p,manager:me.manager}:p);save();closeSide()}

function importCsv(i){const f=i.files[0];if(!f)return;f.text().then(t=>{const n=parseCsv(t);if(!n.length){alert("No rows found. Need columns name,title,team,manager,notes.");return}if(!confirm("Replace current chart with "+n.length+" imported people?"))return;P=n;collapsed={};save();closeSide();render()});i.value=""}

(function(){let sv=null,tiles=[],lgs=[];const vp=()=>document.getElementById("vp"),st=()=>document.getElementById("stage");
window.addEventListener("beforeprint",()=>{const s=st();sv=s.style.transform;s.style.transform="none";document.body.classList.add("printing");
s.querySelectorAll("ul").forEach(u=>{const c=[...u.children];if(c.length>=3&&c.every(l=>!l.querySelector("ul"))){u.classList.add("lg");u.style.setProperty("--cols",Math.max(2,Math.min(6,Math.ceil(c.length/5))));lgs.push(u)}});
let mx=0,my=0,x0=1e9,sr=s.getBoundingClientRect();s.querySelectorAll(".card").forEach(c=>{const r=c.getBoundingClientRect();mx=Math.max(mx,r.right-sr.left);my=Math.max(my,r.bottom-sr.top);x0=Math.min(x0,r.left-sr.left)});
const w=Math.ceil(mx+6),h=Math.ceil(my+6),PW=1050,PH=730,k=Math.min(1,PW/w,PH/h);
if(k>=0.3){s.style.transform="scale("+k+")";s.style.width=w+"px";vp().style.height=Math.ceil(h*k)+"px";vp().style.width=Math.ceil(w*k)+"px";vp().style.setProperty("overflow","hidden","important");vp().style.flex="none";window.__k=k;return}
const r=0.5,sw=PW/r,n=Math.ceil(w/sw);s.style.display="none";vp().style.flex="none";vp().style.height="auto";
for(let i=0;i<n;i++){const t=document.createElement("div");t.className="ptile";
t.style.cssText="position:relative;overflow:hidden;width:"+PW+"px;height:"+Math.ceil(h*r)+"px;break-after:page;page-break-after:always";
const c=s.cloneNode(true);c.removeAttribute("id");c.style.cssText="display:block;position:absolute;left:0;top:0;transform-origin:0 0;transform:scale("+r+") translateX("+(-i*sw)+"px)";
t.appendChild(c);vp().appendChild(t);tiles.push(t)}});
window.addEventListener("afterprint",()=>{if(sv===null)return;tiles.forEach(t=>t.remove());tiles=[];lgs.forEach(u=>{u.classList.remove("lg");u.style.removeProperty("--cols")});lgs=[];document.body.classList.remove("printing");const s=st();s.style.width="";s.style.display="";s.style.transform=sv;vp().style.height="";vp().style.width="";vp().style.removeProperty("overflow");vp().style.flex="";sv=null});})();
</script></body></html>
